<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're on the list · Matcha &amp; Mingle</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--matcha-deep:#3f5b3e;--matcha:#5b7c5a;--sage:#a7bea0;--matcha-bright:#7fa05c;--cream:#f6f2e7;--white:#fffdf8;--ink:#2a3327;--ink-soft:#586353}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem;
    color:var(--ink);
    background:radial-gradient(120% 90% at 80% 10%,rgba(127,160,92,.28),transparent 55%),radial-gradient(100% 80% at 10% 90%,rgba(167,190,160,.35),transparent 50%),var(--cream);}
  .card{max-width:520px}
  .emoji{font-size:4rem;margin-bottom:1rem;display:block;animation:pop .6s ease}
  @keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(2.2rem,7vw,3.4rem);line-height:1.1;margin-bottom:1rem;letter-spacing:-.01em}
  h1 em{font-style:italic;color:var(--matcha)}
  p{color:var(--ink-soft);font-size:1.1rem;max-width:420px;margin:0 auto 2rem}
  .btn{display:inline-block;background:var(--matcha-deep);color:var(--cream);padding:1rem 2rem;border-radius:100px;font-weight:600;text-decoration:none;transition:transform .2s,background .2s}
  .btn:hover{transform:translateY(-2px);background:var(--matcha)}
</style>
</head>
<body>
  <div class="card">
    <img class="emoji" src="wordmark.png" alt="Matcha &amp; Mingle" style="width:min(420px,80vw);height:auto;margin-bottom:1rem" />
    <h1>You're <em>in.</em></h1>
    <p>Thanks for joining the Matcha &amp; Mingle list. We'll be in touch with the date, location, and early access soon. Breathe easy.</p>
    <a class="btn" href="/">Back to home</a>
  </div>
</body>
</html>
